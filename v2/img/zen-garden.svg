  <!-- Stone lantern -->
  <g>
    <ellipse cx="96" cy="432" rx="60" ry="46" fill="url(#glow)" class="lamp"/>
    <path d="M56 606 C58 584 78 572 100 572 C128 572 150 584 156 606 Z" fill="#8a8880"/>
    <rect x="80" y="476" width="34" height="100" fill="#9d9b92"/>
    <rect x="80" y="476" width="10" height="100" fill="#aba99f"/>
    <rect x="56" y="464" width="82" height="14" rx="3" fill="#8f8d85"/>
    <rect x="66" y="408" width="62" height="56" fill="#a3a198"/>
    <g class="lamp" fill="#ffe2a6">
      <rect x="76" y="418" width="16" height="34" rx="1"/>
      <rect x="102" y="418" width="16" height="34" rx="1"/>
    </g>
    <path d="M20 410 C50 396 70 386 96 384 C124 386 146 396 176 410 C150 416 44 416 20 410 Z" fill="#87857d"/>
    <path d="M40 404 C62 394 78 388 96 386 C116 388 132 394 154 404 C126 400 68 400 40 404 Z" fill="#9c9a91"/>
    <ellipse cx="97" cy="378" rx="14" ry="10" fill="#8f8d85"/>
    <circle cx="97" cy="366" r="6" fill="#8f8d85"/>
  </g>

  <!-- Foreground shrubs by the lantern -->
  <ellipse cx="30" cy="560" rx="80" ry="40" fill="#638663"/>
  <ellipse cx="190" cy="586" rx="60" ry="30" fill="#6d8f69"/>
  <ellipse cx="20" cy="604" rx="80" ry="34" fill="#7a9a72"/>
  <ellipse cx="760" cy="596" rx="80" ry="36" fill="#6d8f69"/>
  <ellipse cx="800" cy="570" rx="60" ry="34" fill="#638663"/>
  <!-- Grass tuft, right -->
  <g fill="none" stroke="#557857" stroke-width="5" stroke-linecap="round">
    <path d="M650 606 C646 590 640 580 630 572"/>
    <path d="M654 606 C654 588 656 578 662 566"/>
    <path d="M658 606 C664 592 672 584 684 578"/>
    <path d="M646 606 C638 596 630 592 618 590"/>
  </g>

  <!-- Pond -->
  <path d="M0 612 C200 600 520 606 800 610 L800 700 L0 700 Z" fill="url(#pond)"/>
  <!-- reflections -->
  <g opacity=".35">
    <ellipse cx="170" cy="650" rx="150" ry="26" fill="#6f8f76"/>
    <ellipse cx="640" cy="664" rx="90" ry="18" fill="#e9a8a3"/>
  </g>
  <g fill="none" stroke="#c4d2c0" stroke-width="1.5" opacity=".7">
    <path d="M300 676 C360 672 420 672 480 676"/>
    <path d="M500 648 C540 645 580 645 620 648"/>
  </g>
  <!-- lily pads -->
  <g fill="#a9c08a">
    <ellipse cx="60" cy="646" rx="42" ry="9"/>
    <ellipse cx="164" cy="634" rx="36" ry="8"/>
    <ellipse cx="258" cy="644" rx="42" ry="9"/>
    <ellipse cx="118" cy="664" rx="46" ry="10"/>
    <ellipse cx="220" cy="618" rx="34" ry="7"/>
  </g>
  <g fill="#b9cd9c" opacity=".8">
    <ellipse cx="54" cy="644" rx="26" ry="4"/>
    <ellipse cx="112" cy="662" rx="28" ry="4"/>
    <ellipse cx="252" cy="642" rx="26" ry="4"/>
  </g>

  <!-- Stone edging between sand and pond -->
  <g>
    <path d="M30 616 C40 596 90 588 150 590 C190 592 214 602 218 616 Z" fill="#8a8880"/>
    <path d="M200 618 C212 600 270 594 340 596 C384 598 404 606 408 618 Z" fill="#969389"/>
    <path d="M376 620 C384 606 420 600 458 602 C480 604 490 610 492 620 Z" fill="#8a8880"/>
    <path d="M548 622 C556 604 596 598 640 600 C668 602 684 610 688 622 Z" fill="#8f8d85"/>
    <path d="M704 626 C712 612 748 606 800 608 L800 626 Z" fill="#8a8880"/>
    <path d="M0 620 C2 606 24 600 48 604 L48 620 Z" fill="#7f7d76"/>
    <path d="M478 620 C500 612 530 612 552 620 Z" fill="#8fae7e"/>
  </g>

  <!-- Near bank -->
  <path d="M370 700 C470 672 640 652 800 640 L800 700 Z" fill="#b7996d"/>
  <path d="M370 700 C470 676 640 658 800 648 L800 652 C640 664 480 682 400 700 Z" fill="#a98b60" opacity=".6"/>
  <g fill="#7f7d76">
    <ellipse cx="600" cy="686" rx="18" ry="5"/>
    <ellipse cx="520" cy="696" rx="14" ry="4"/>
    <ellipse cx="724" cy="664" rx="22" ry="8"/>
  </g>
  <g fill="none" stroke="#6d8f69" stroke-width="4" stroke-linecap="round">
    <path d="M762 656 C758 644 752 638 742 634"/>
    <path d="M766 656 C766 642 770 634 778 626"/>
    <path d="M770 656 C778 646 786 642 798 640"/>
  </g>
  <path d="M0 700 C0 660 40 640 96 644 C150 648 190 672 204 700 Z" fill="#7f7d76"/>
  <path d="M14 676 C30 656 60 648 96 650 C130 652 156 662 176 680 C130 664 60 662 14 676 Z" fill="#908d86"/>
</svg>
