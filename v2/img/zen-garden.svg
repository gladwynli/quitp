    <ellipse cx="436" cy="493" rx="124" ry="33"/>
    <ellipse cx="436" cy="494" rx="146" ry="41"/>
    <ellipse cx="436" cy="495" rx="170" ry="50" opacity=".8"/>
    <!-- rings round the left rock -->
