  </g>

  <!-- Shrubs, left -->
  <g>
    <ellipse cx="60" cy="400" rx="110" ry="54" fill="#5f8160"/>
    <ellipse cx="160" cy="372" rx="64" ry="34" fill="#557857"/>
    <ellipse cx="230" cy="436" rx="80" ry="34" fill="#6d8f69"/>
