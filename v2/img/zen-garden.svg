  <!-- Rocks in the sand -->
  <g>
    <ellipse cx="436" cy="500" rx="88" ry="9" fill="#cfc2a5" opacity=".8"/>
    <path d="M352 498 C360 470 392 446 428 444 C466 442 500 462 518 496 C470 506 400 506 352 498 Z" fill="#77756f"/>
    <path d="M372 484 C384 462 404 450 428 448 C452 448 474 458 490 476 C452 466 410 468 372 484 Z" fill="#8d8a83"/>

    <ellipse cx="292" cy="526" rx="52" ry="6" fill="#cfc2a5" opacity=".8"/>
    <path d="M244 524 C250 506 268 494 290 494 C314 494 332 506 340 524 C310 530 272 530 244 524 Z" fill="#7b7973"/>
    <path d="M256 514 C264 502 276 497 290 497 C306 497 318 503 326 512 C304 507 278 508 256 514 Z" fill="#908d86"/>

    <ellipse cx="602" cy="524" rx="56" ry="6" fill="#cfc2a5" opacity=".8"/>
    <path d="M550 522 C556 502 576 490 600 490 C626 490 646 502 654 522 C622 528 582 528 550 522 Z" fill="#77756f"/>
    <path d="M564 510 C572 498 584 493 600 493 C616 493 630 499 640 510 C616 504 588 504 564 510 Z" fill="#8d8a83"/>
