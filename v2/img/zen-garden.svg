    <path d="M60 476 C240 462 520 460 820 474"/>
    <path d="M60 488 C240 474 520 472 820 486" opacity=".7"/>
    <path d="M60 548 C260 562 560 562 820 546"/>
    <path d="M60 560 C260 574 560 574 820 558"/>
    <path d="M60 572 C260 586 560 586 820 570"/>
    <path d="M60 584 C260 598 560 598 820 582" opacity=".8"/>
    <path d="M60 596 C260 610 560 610 820 594" opacity=".6"/>
    <!-- rings round the centre rock -->
