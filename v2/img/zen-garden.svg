<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 800 700" role="img" aria-label="A quiet zen garden at dawn">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ebe2cb"/>
      <stop offset=".55" stop-color="#f4ecd9"/>
      <stop offset="1" stop-color="#e9e6d2"/>
    </linearGradient>
    <linearGradient id="mist" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eef0e0" stop-opacity="0"/>
      <stop offset="1" stop-color="#eef0e0" stop-opacity=".75"/>
    </linearGradient>
    <linearGradient id="pond" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8fa795"/>
      <stop offset="1" stop-color="#a9bdaa"/>
    </linearGradient>
    <linearGradient id="fence" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cdb884"/>
      <stop offset="1" stop-color="#bfa873"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#ffe6ae" stop-opacity=".7"/>
      <stop offset="1" stop-color="#ffe6ae" stop-opacity="0"/>
    </radialGradient>
    <pattern id="slats" width="9" height="60" patternUnits="userSpaceOnUse">
      <rect width="9" height="60" fill="none"/>
      <line x1="8.5" y1="0" x2="8.5" y2="60" stroke="#a8925f" stroke-width="1" opacity=".7"/>
    </pattern>
    <clipPath id="sandClip">
      <path d="M150 452 C300 430 600 432 800 448 L800 606 C560 612 300 610 150 600 C90 560 90 480 150 452 Z"/>
    </clipPath>
    <path id="fir" d="M0 -60 L9 -40 L5 -40 L15 -20 L9 -20 L20 2 L-20 2 L-9 -20 L-15 -20 L-5 -40 L-9 -40 Z"/>
    <style>
      .lamp { animation: lamp 5s ease-in-out infinite; transform-origin: 96px 432px; }
      @keyframes lamp { 50% { opacity: .55; } }
      @media (prefers-reduced-motion: reduce) { .lamp { animation: none; } }
    </style>
  </defs>

  <!-- Sky -->
  <rect width="800" height="700" fill="url(#sky)"/>

  <!-- Mountains, far to near -->
  <path d="M130 330 C220 250 300 205 350 205 C400 205 440 235 500 250 L500 360 L130 360 Z" fill="#cfd4c2"/>
  <path d="M300 340 C420 300 520 210 620 160 C680 130 730 135 800 170 L800 380 L300 380 Z" fill="#b9c4b1"/>
  <path d="M0 330 C90 300 200 290 290 310 C350 325 400 345 440 360 L0 380 Z" fill="#c2cbb8"/>
  <path d="M0 360 C120 330 260 345 380 372 C520 330 680 300 800 290 L800 420 L0 420 Z" fill="#a9b9a6"/>
  <rect y="250" width="800" height="130" fill="url(#mist)"/>

  <!-- Distant forest -->
  <g fill="#95aa94">
    <use xlink:href="#fir" transform="translate(330 392)"/>
    <use xlink:href="#fir" x="368" y="386"/>
    <use xlink:href="#fir" transform="translate(405 372) scale(1.25)"/>
    <use xlink:href="#fir" x="446" y="384"/>
    <use xlink:href="#fir" transform="translate(486 368) scale(1.4)"/>
    <use xlink:href="#fir" x="530" y="382"/>
    <use xlink:href="#fir" transform="translate(566 372) scale(1.2)"/>
  </g>
  <g fill="#8ea48d">
    <use xlink:href="#fir" transform="translate(690 330) scale(1.1)"/>
    <use xlink:href="#fir" transform="translate(722 318) scale(1.3)"/>
    <use xlink:href="#fir" transform="translate(760 308) scale(1.4)"/>
    <use xlink:href="#fir" x="792" y="322"/>
    <ellipse cx="640" cy="345" rx="44" ry="34"/>
    <ellipse cx="610" cy="372" rx="40" ry="26"/>
    <ellipse cx="675" cy="372" rx="46" ry="28"/>
    <rect x="634" y="360" width="8" height="40"/>
  </g>
  <!-- Rounded treeline behind the fence -->
  <g fill="#86a085">
    <ellipse cx="250" cy="398" rx="50" ry="26"/>
    <ellipse cx="320" cy="402" rx="48" ry="22"/>
    <ellipse cx="400" cy="404" rx="50" ry="20"/>
    <ellipse cx="480" cy="398" rx="54" ry="26"/>
    <ellipse cx="560" cy="402" rx="50" ry="24"/>
    <ellipse cx="640" cy="400" rx="56" ry="26"/>
    <ellipse cx="170" cy="380" rx="70" ry="40"/>
