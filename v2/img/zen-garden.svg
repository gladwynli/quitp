      <ellipse cx="170" cy="250" rx="66" ry="17"/>
      <ellipse cx="180" cy="322" rx="104" ry="20"/>
      <ellipse cx="60" cy="300" rx="70" ry="16"/>
    </g>
    <g fill="#6f9069">
      <ellipse cx="74" cy="218" rx="72" ry="19"/>
      <ellipse cx="40" cy="200" rx="50" ry="16"/>
      <ellipse cx="166" cy="238" rx="60" ry="15"/>
      <ellipse cx="176" cy="308" rx="98" ry="18"/>
      <ellipse cx="130" cy="294" rx="60" ry="14"/>
      <ellipse cx="54" cy="288" rx="62" ry="14"/>
