  <rect x="170" y="388" width="630" height="62" fill="url(#fence)"/>
  <rect x="170" y="388" width="630" height="62" fill="url(#slats)"/>
  <rect x="170" y="386" width="630" height="5" fill="#b39c66"/>
  <rect x="170" y="398" width="630" height="3" fill="#a8925f" opacity=".8"/>
  <g fill="#9c8455">
    <rect x="228" y="378" width="7" height="74" rx="2"/>
    <rect x="350" y="378" width="7" height="74" rx="2"/>
    <rect x="474" y="378" width="7" height="74" rx="2"/>
    <rect x="600" y="378" width="7" height="74" rx="2"/>
    <rect x="726" y="378" width="7" height="74" rx="2"/>
  </g>

  <!-- Cherry tree -->
  <g>
    <path d="M790 440 C782 400 772 372 752 344 M772 372 C760 360 742 352 722 350 M764 358 C768 340 778 326 792 316 M752 344 C740 330 724 322 706 322"
          fill="none" stroke="#7b5d50" stroke-width="7" stroke-linecap="round"/>
    <path d="M778 446 C776 420 772 398 764 372 L774 370 C784 398 790 420 792 446 Z" fill="#7b5d50"/>
    <g fill="#e9a8a3">
      <ellipse cx="660" cy="330" rx="62" ry="26"/>
      <ellipse cx="730" cy="350" rx="50" ry="20"/>
      <ellipse cx="700" cy="290" rx="64" ry="34"/>
    </g>
    <g fill="#f1bcb4">
      <ellipse cx="760" cy="262" rx="64" ry="40"/>
      <ellipse cx="690" cy="278" rx="52" ry="26"/>
      <ellipse cx="640" cy="318" rx="52" ry="20"/>
      <ellipse cx="790" cy="310" rx="40" ry="26"/>
      <ellipse cx="735" cy="330" rx="38" ry="14"/>
    </g>
    <g fill="#f6cfc6" opacity=".9">
      <ellipse cx="748" cy="246" rx="38" ry="18"/>
      <ellipse cx="676" cy="268" rx="30" ry="12"/>
      <ellipse cx="628" cy="310" rx="30" ry="9"/>
